[project]
name = "corner-shop"
version = "0.1.2"
description = "Run a small shop for 13 weeks, scored by a going-concern reward that catches end-of-episode cheating."
requires-python = ">=3.11"
dependencies = ["verifiers==0.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corner_shop"]

[tool.hatch.build]
artifacts = ["corner_shop/going_concern/**", "corner_shop/firms/**"]
